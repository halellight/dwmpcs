V.compare=()=>{const o=LGAS.map(x=>[x.n,mob.matches?`${x.n} (${x.s.replace(' State','')})`:x.n]),stt=n=>LGAS.find(x=>x.n===n)?.s.replace(' State','')||'',ok=S.c1&&S.c2;let body=`<div class="empty"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#adadad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v28h28M12 26l7-8 6 5 9-11"/></svg><p class="sm" style="color:var(--g800)">No comparisons made... yet</p><p class="xs sub">Select two local government areas to compare voting statistics</p></div>`;
if(ok){const A=votes(S.c1),B=votes(S.c2),f=(a,b,fm=fmt)=>[a,b].map((x,k)=>`<div class="${(k?b>a:a>=b)?'hl':''}">${typeof x==='number'?fm(x):x}</div>`).join(''),rw=(l,a,b,dot,fm)=>`<div class="tr"><div>${dot?`<i class="dot" style="background:${dot}"></i>`:''}${l}</div>${f(a,b,fm)}</div>`,ta=sum(A),tb=sum(B),mg=v=>{const s=rank(v);return(s[0][0]-s[1][0])/sum(v)*100},ra=Math.round(ta*(2.2+rng(S.c1)())),rb=Math.round(tb*(2.2+rng(S.c2)())),ma=Math.round(ta*.55),mb=Math.round(tb*.55);
body=`<div class="tw pad" style="padding:0"><div style="min-width:720px"><div class="tr h"><div>Metric</div><div>${S.c1}</div><div>${S.c2}</div></div><div class="tr mrow"><div>State</div><div>${stt(S.c1)}</div><div>${stt(S.c2)}</div></div>${P.map((p,i)=>rw(p.k+' votes',A[i],B[i],col(i))).join('')}<div class="tr sep"><div>Total votes</div>${f(ta,tb)}</div>${rw('Winning margin',+mg(A).toFixed(1),+mg(B).toFixed(1),0,x=>x.toFixed(1))}<div class="gap"></div>${rw('Registered voters',ra,rb)}${rw('Male voters',ma,mb)}${rw('Female voters',ta-ma,tb-mb)}</div></div><div class="note sm pad" style="margin:16px 20px 0">${layers}<p>${ta>tb?S.c1:S.c2} recorded ${fmt(Math.max(ta,tb))} votes against ${fmt(Math.min(ta,tb))} in ${ta>tb?S.c2:S.c1}, with ${P[rank(ta>tb?A:B)[0][1]].k} leading.</p></div>`}
return`<div class="page">${ph('LGA Comparison',`<div class="pair">${sel('c1',o,S.c1,'',mob.matches?'Select LGA 1':'Choose LGA 1')}${sel('c2',o,S.c2,'',mob.matches?'Select LGA 2':'Choose LGA 2')}</div>`)}${body}</div>`};
V.insights=()=>{const rows=LGAS.map(x=>{const v=votes(x.n+'i'),[a,b]=rank(v),tot=a[0]+b[0];return{...x,a,b,d:(a[0]-b[0])/tot*100}}).sort((p,q)=>p.d-q.d),card=(t,l)=>`<div class="card"><div class="row" style="justify-content:space-between"><p class="card-t">${t}</p></div>${l.map(r=>`<div class="cc"><div class="fl"><p class="md ell">${r.n}</p><p class="xs sub">${r.s}</p></div><div class="row"><div class="pk" style="--bg:var(${TINT[r.a[1]]});--c:${col(r.a[1])}"><div><p class="sm">${P[r.a[1]].k}</p><p class="xs sub">${fmt(r.a[0])}</p></div><i class="bar2"></i></div><div class="pts sm row" style="justify-content:center">${r.d.toFixed(1)} pts</div><div class="pk r" style="--c:${col(r.b[1])}"><div><p class="sm">${P[r.b[1]].k}</p><p class="xs sub">${fmt(r.b[0])}</p></div><i class="bar2"></i></div></div></div>`).join('')}</div>`;
return`<div class="page">${ph(S.y+' Insights')}<div class="cards">${card('Closest LGA contests',rows.slice(0,4))}${card('Widest LGA contests',rows.slice(-4).reverse())}</div></div>`};
V.method=()=>`<div class="page">${ph('Methodology')}<p class="pad r14 sub">Placeholder – no Methodology screen exists in the Figma section yet.</p></div>`;
/* shell */
const TABS=[['map','Map'],['dashboard','National Dashboard'],['compare','LGA Comparison'],['insights','Political Insights'],['method','Methodology']];
function render(){const id=V[location.hash.slice(1)]?location.hash.slice(1):'map';$('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#${k}"${k===id?' aria-current="page"':''}>${l}</a>`).join('');$('#navm').innerHTML=`<span class="chip">${TABS.find(t=>t[0]===id)[1]}</span>${ic('sel',20,'#919191')}<select id="navsel" aria-label="View">${TABS.map(([k,l])=>`<option value="${k}"${k===id?' selected':''}>${l}</option>`).join('')}</select>`;$('#navsel').onchange=e=>{location.hash=e.target.value};const v=$('#v');v.innerHTML=V[id]();
if(id==='map'){S.srch=0;mapInit();const mp=$('#mp');mp.onpointermove=e=>tip(e.clientX,e.clientY);mp.onpointerleave=()=>tip();mp.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.z=Math.max(.8,Math.min(2,S.z+.25*b.dataset.z));$('#zw').style.transform=`scale(${S.z})`});$('#zw').style.transform=`scale(${S.z})`}
else run(v);
if(id==='compare'){const re=()=>{S.c1=$('#c1').value;S.c2=$('#c2').value;render()};$('#c1').onchange=re;$('#c2').onchange=re}
if(id==='insights'||id==='dashboard')0}
$('#year').innerHTML=['2023','2019','2015'].map(y=>`<option>${y}</option>`).join('');$('#year').onchange=e=>{S.y=e.target.value;render()};
addEventListener('hashchange',render);mob.addEventListener?.('change',render);render();
})();
</script></body></html>
